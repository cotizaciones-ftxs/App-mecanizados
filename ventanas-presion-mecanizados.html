<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventanas de presión | Mecanizados</title>
  <style>
    :root { --bg:#eef2f6; --panel:#fff; --ink:#17202a; --muted:#667085; --line:#cfd7e3; --blue:#0d63a5; --blue-dark:#084a7c; --green:#147a43; --shadow:0 16px 38px rgba(23,32,42,.1); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font-family:Arial,Helvetica,sans-serif; }
    button,input { font:inherit; }
    .app { max-width:1120px; margin:0 auto; padding:20px; }
    header { display:grid; gap:6px; margin-bottom:16px; }
    h1 { margin:0; font-size:56px; line-height:1.05; }
    .lead { margin:0; color:var(--muted); line-height:1.4; }
    .menu-link { color:var(--blue); font-size:14px; font-weight:700; text-decoration:none; }
    .layout { display:grid; grid-template-columns:minmax(300px,430px) 1fr; gap:16px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); }
    .panel-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    h2 { margin:0; font-size:18px; }
    .panel-body { padding:16px; display:grid; gap:14px; }
    label { display:grid; gap:7px; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; }
    input { width:100%; min-height:44px; padding:10px; color:var(--ink); background:#fff; border:1px solid #bfc9d6; border-radius:6px; font-size:20px; font-weight:700; }
    input:focus { outline:3px solid #afd7fb; border-color:var(--blue); }
    .button-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .choice-group { display:grid; gap:8px; }
    .choice-title { color:var(--ink); font-size:13px; font-weight:700; text-transform:none; }
    .choice-btn,.btn { min-height:46px; padding:10px 12px; color:var(--ink); background:#fff; border:1px solid #bfc9d6; border-radius:7px; cursor:pointer; font-weight:700; text-align:center; }
    .choice-btn:hover,.btn:hover { background:#f4f7fa; }
    .choice-btn.active,.btn.primary { color:#fff; background:var(--blue); border-color:var(--blue); }
    .btn.primary:hover { background:var(--blue-dark); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .status { min-height:20px; color:var(--green); font-size:13px; font-weight:700; }
    .answer { display:grid; gap:10px; }
    .result-card { padding:13px 14px; background:#fff; border:1px solid var(--line); border-left:5px solid var(--blue); border-radius:8px; }
    .code { margin:0; font-family:Consolas,"Courier New",monospace; font-size:clamp(18px,3vw,27px); font-weight:700; overflow-wrap:anywhere; }
    .copy-box { width:100%; min-height:190px; padding:12px; resize:vertical; color:#e5edf7; background:#111827; border:1px solid var(--line); border-radius:8px; font:15px/1.5 Consolas,"Courier New",monospace; white-space:pre; }
    .pill-row { display:flex; flex-wrap:wrap; gap:8px; }
    .pill { display:inline-flex; width:max-content; padding:5px 9px; color:#084a7c; background:#e7f2ff; border-radius:999px; font-size:12px; font-weight:700; }
    .pill.green { color:var(--green); background:#e7f6ee; }
    @media (max-width:880px) { .layout{grid-template-columns:1fr} }
    @media (max-width:560px) { .app{padding:14px} h1{font-size:36px} .button-grid{grid-template-columns:1fr} .actions{display:grid} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Ventanas de presión</h1>
      <p class="lead">Pon el largo, selecciona el palo y el herraje. La respuesta sale solo con códigos.</p>
      <a class="menu-link" href="index.html">Volver al menú</a>
    </header>
    <div class="layout">
      <section class="panel">
        <div class="panel-head"><h2>Selección</h2></div>
        <div class="panel-body">
          <label>Largo del perfil mm
            <input id="totalLength" type="number" min="0" step="0.1" value="2500">
          </label>
          <label>Palo
            <div class="button-grid" aria-label="Palo de la ventana">
              <button class="choice-btn stick-btn active" type="button" data-stick="IZQUIERDO">Palo izquierdo</button>
              <button class="choice-btn stick-btn" type="button" data-stick="DERECHO">Palo derecho</button>
            </div>
          </label>
          <label>Herraje
            <div class="choice-group">
              <div class="choice-title">Manilla</div>
              <div class="button-grid">
                <button class="choice-btn handle-btn active" type="button" data-handle="INTERIOR">Manilla interior · 502</button>
                <button class="choice-btn handle-btn" type="button" data-handle="EXTERIOR">Manilla exterior · 500</button>
                <button class="choice-btn handle-btn" type="button" data-handle="AMBAS">Manilla interior + exterior</button>
              </div>
              <div class="choice-title">Cajeado de cremona</div>
              <div class="button-grid">
                <button class="choice-btn cajeado-btn active" type="button" data-cajeado="700">700 · canal 12 × 65 mm</button>
                <button class="choice-btn cajeado-btn" type="button" data-cajeado="702">702 · canal 12 × 88 mm</button>
              </div>
            </div>
          </label>
          <label>Altura del mecanizado en mm
            <input id="machiningMeasure" type="number" min="0" step="0.1" value="0">
          </label>
          <div class="actions">
            <button class="btn primary" id="copyBtn" type="button">Copiar respuesta</button>
            <button class="btn" id="resetBtn" type="button">Reiniciar</button>
          </div>
          <div class="status" id="status"></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Respuesta</h2><div class="pill-row"><span class="pill" id="basePill">Palo izquierdo 0 mm</span><span class="pill green" id="countPill">0 códigos</span></div></div>
        <div class="panel-body">
          <div class="answer" id="answer"></div>
          <label for="copyText">Códigos para copiar
            <textarea class="copy-box" id="copyText" readonly></textarea>
          </label>
        </div>
      </section>
    </div>
  </main>
  <script>
    const state = { stick: 'IZQUIERDO', handle: 'INTERIOR', cajeado: '700' };
    const totalLength = document.querySelector('#totalLength');
    const measure = document.querySelector('#machiningMeasure');
    const stickButtons = [...document.querySelectorAll('.stick-btn')];
    const handleButtons = [...document.querySelectorAll('.handle-btn')];
    const cajeadoButtons = [...document.querySelectorAll('.cajeado-btn')];
    const answer = document.querySelector('#answer');
    const copyText = document.querySelector('#copyText');
    const countPill = document.querySelector('#countPill');
    const status = document.querySelector('#status');
    function mmCode(mm) {
      return String(Math.max(0, Math.round(Number(mm || 0) * 10))).padStart(5, '0');
    }
    function machiningPosition() {
      const distance = Number(measure.value || 0);
      if (state.stick === 'DERECHO') return Math.max(0, Number(totalLength.value || 0) - distance);
      return distance;
    }
    function positionText() {
      const position = machiningPosition();
      if (state.stick === 'DERECHO') return `Palo derecho ${totalLength.value || 0} - ${measure.value || 0} = ${position} mm`;
      return `Palo izquierdo ${position} mm`;
    }
    function machineCode(tool, needle) {
      return `W${tool}/00/${mmCode(machiningPosition())}/${mmCode(needle)}`;
    }
    function render() {
      const rows = [];
      if (state.handle === 'INTERIOR' || state.handle === 'AMBAS') rows.push({ tool: '502', needle: 15 });
      if (state.handle === 'EXTERIOR' || state.handle === 'AMBAS') rows.push({ tool: '500', needle: 15 });
      rows.push({ tool: state.cajeado, needle: 0 });
      rows.forEach(row => row.code = machineCode(row.tool, row.needle));
      stickButtons.forEach(button => button.classList.toggle('active', button.dataset.stick === state.stick));
      handleButtons.forEach(button => button.classList.toggle('active', button.dataset.handle === state.handle));
      cajeadoButtons.forEach(button => button.classList.toggle('active', button.dataset.cajeado === state.cajeado));
      document.querySelector('#basePill').textContent = positionText();
      countPill.textContent = `${rows.length} ${rows.length === 1 ? 'código' : 'códigos'}`;
      answer.innerHTML = rows.map(row => `<article class="result-card"><p class="code">${row.code}</p></article>`).join('');
      copyText.value = rows.map(row => row.code).join('\n');
    }
    totalLength.addEventListener('input', render);
    measure.addEventListener('input', render);
    stickButtons.forEach(button => button.addEventListener('click', () => { state.stick = button.dataset.stick; render(); }));
    handleButtons.forEach(button => button.addEventListener('click', () => { state.handle = button.dataset.handle; render(); }));
    cajeadoButtons.forEach(button => button.addEventListener('click', () => { state.cajeado = button.dataset.cajeado; render(); }));
    document.querySelector('#copyBtn').addEventListener('click', async () => { await navigator.clipboard.writeText(copyText.value); status.textContent = 'Respuesta copiada.'; window.setTimeout(() => status.textContent = '', 1600); });
    document.querySelector('#resetBtn').addEventListener('click', () => { totalLength.value = '2500'; measure.value = '0'; state.stick = 'IZQUIERDO'; state.handle = 'INTERIOR'; state.cajeado = '700'; render(); });
    render();
  </script>
</body>
</html>
